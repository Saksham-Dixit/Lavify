<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lavify-Your B'day Gift</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <ul>
            <li class="brand"><img src="lavs.png" alt="Lavify">Lavify</li>
            <li class="special">29 October 2025</li>
            <a  class="btn" href="about.html">LAVSS</a>
            <a class="play" href="https://spotify.link/JRWgQIagQXb"> PLAYLIST </a>
        
        
        </ul>
    </nav>
    <div class="container">
        
        <div class="songList">
            <h1>Happy Musical Birthday Lavie!</h1>
            <div class="songItemContainer">
                <div class="songItem">
                    <img alt="1">
                    <span class="songName">Pashmina</span>
                    <span class="songlistplay"><span class="timestamp">04:43 <i id="0" class="far songItemPlay fa-play-circle"></i></span></span>
                </div>
                <div class="songItem">
                    <img alt="1">
                    <span class="songName">Masakali</span>
                    <span class="songlistplay"><span class="timestamp">04:48 <i id="1" class="far songItemPlay fa-play-circle"></i></span></span>
                </div>
                <div class="songItem">
                    <img alt="1">
                    <span class="songName">Ishq - From 'Lost;Found'</span>
                    <span class="songlistplay"><span class="timestamp">03:44 <i id="2" class="far songItemPlay fa-play-circle"></i></span></span>
                </div>
                <div class="songItem">
                    <img alt="1">
                    <span class="songName">Yeh Fitoor Mera</span>
                    <span class="songlistplay"><span class="timestamp">04:43 <i id="3" class="far songItemPlay fa-play-circle"></i></span></span>
                </div>
                <div class="songItem">
                    <img alt="1">
                    <span class="songName">Sawaar Loon</span>
                    <span class="songlistplay"><span class="timestamp">04:14 <i id="4" class="far songItemPlay fa-play-circle"></i></span></span>
                </div>
                
                
        </div>
        <div class="songBanner"></div>

    </div>
    <div class="bottom">
        <input type="range" name="range" id="myProgressBar" min="0" max="100">
        <div class="icons">
            <!-- fontawesome icons -->
             <i class="fas fa-3x fa-step-backward" id="previous"></i>
            <i class="far fa-3x fa-play-circle" id="masterPlay"></i>
            <i class="fas fa-3x fa-step-forward" id="next"></i>
        </div>
        <div class="songInfo">
            <img src="playing.gif" width="42px" alt="" id="gif"> <span id="masterSongName"></span>
        </div>
    </div>
    <script src="https://kit.fontawesome.com/26504e4a1f.js" crossorigin="anonymous"></script>
    <script src="script.js"></script>
    
    
</body>
</html>
